name: Anime Recommendation

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  recommend:
    runs-on: ubuntu-latest

    steps:
      - name: Get random anime and post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          node <<'EOF'
          const response = await fetch(
            "https://api.jikan.moe/v4/random/anime"
          );

          const result = await response.json();
          const anime = result.data;

          const genres = anime.genres
            ?.map(g => g.name)
            .join(" • ") || "Unknown";

          const embed = {
            title: `🍥 ${anime.title}`,
            url: anime.url,
            description: anime.synopsis
              ? anime.synopsis.substring(0, 800)
              : "No synopsis available.",
            color: 16711935,
            fields: [
              {
                name: "⭐ Score",
                value: anime.score
                  ? `${anime.score}/10`
                  : "N/A",
                inline: true
              },
              {
                name: "📺 Episodes",
                value: anime.episodes
                  ? String(anime.episodes)
                  : "N/A",
                inline: true
              },
              {
                name: "🎭 Genres",
                value: genres.substring(0, 1000),
                inline: false
              }
            ],
            image: {
              url: anime.images.jpg.large_image_url
            },
            footer: {
              text: "🍥 Anime Recommendation System"
            }
          };

          const discordResponse = await fetch(
            process.env.DISCORD_WEBHOOK,
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                content: "✨ **New Anime Recommendation!**",
                embeds: [embed]
              })
            }
          );

          if (!discordResponse.ok) {
            throw new Error(
              `Discord error: ${discordResponse.status}`
            );
          }

          console.log(`Recommended: ${anime.title}`);
          EOF
